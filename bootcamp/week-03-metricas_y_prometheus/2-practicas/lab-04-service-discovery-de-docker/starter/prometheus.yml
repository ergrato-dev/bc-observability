# Configuración de Prometheus de tu tienda. La monta compose.yaml en
# /etc/prometheus: tras cambiarla, valídala y recárgala:
#   docker compose -f app/compose.yaml exec prometheus promtool check config /etc/prometheus/prometheus.yml
#   curl -X POST http://127.0.0.1:9090/-/reload
#
# Lab 04: copia este archivo a $TIENDA/prometheus/prometheus.yml.
global:
  scrape_interval: 15s

scrape_configs:
  # Un solo job descubre en Docker todo lo que se deja scrapear: los servicios
  # de la tienda, los exporters y el propio Prometheus.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        # TODO paso 3: filtra los contenedores del proyecto de Compose "tienda"
        # (label com.docker.compose.project).
    relabel_configs:
      # TODO paso 4: quédate solo con los contenedores con prometheus.io/scrape=true
      # y scrapea cada uno en su IP y en el puerto de prometheus.io/port.

      # TODO paso 5: job = nombre del servicio en Compose; instance = nombre del
      # contenedor sin la barra inicial.
