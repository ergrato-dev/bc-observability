  <text x="30" y="38" fill="#e6edf3" font-size="20" font-weight="600" text-anchor="start">El request_id de un pedido por los cuatro servicios</text>
  <text x="30" y="62" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">Cada salto lleva el mismo request_id: así se unen las líneas de los cuatro servicios.</text>
