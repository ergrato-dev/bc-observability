# Rotación de los logs de los contenedores de la tienda (SOLUCIÓN).
# Uso: docker compose -f app/compose.yaml -f <este archivo> up -d --no-build
#
# Sin esto, el driver json-file de Docker guarda los logs de cada contenedor en
# un único archivo que crece sin límite.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  catalogo:
    logging: *logging
  pedidos:
    logging: *logging
  pagos:
    logging: *logging
  notificaciones:
    logging: *logging
