<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Cómo estima histogram_quantile</title>
  <desc id="d">Los cobros de pagos tardan entre 0,04 y 0,12 segundos repartidos de forma uniforme, así que el percentil 95 real es 0,116 s. Prometheus solo conoce los buckets: el 75 % tarda 0,1 s o menos y el 100 %, 0,25 s o menos. Para el percentil 95 interpola en línea recta dentro del bucket de 0,1 a 0,25 s y obtiene 0,22 s, casi el doble del valor real.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#79c0ff"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d2a8ff"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F5A800"/></marker></defs>
  <rect width="960" height="530" fill="#0d1117"/>
  <rect width="5" height="530" fill="#F5A800"/>
  <text x="30" y="38" fill="#e6edf3" font-size="20" font-weight="600" text-anchor="start">Cómo estima histogram_quantile</text>
  <text x="30" y="62" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">Dentro de un bucket, histogram_quantile supone las observaciones repartidas de forma uniforme.</text>
  <line x1="110" y1="400" x2="870" y2="400" stroke="#30363d" stroke-width="1.5"/>
  <line x1="110" y1="400" x2="110" y2="100" stroke="#30363d" stroke-width="1.5"/>
  <text x="870" y="440" fill="#8b949e" font-size="12" font-weight="400" text-anchor="end">duración del cobro (s)</text>
  <text x="100" y="90" fill="#8b949e" font-size="12" font-weight="400" text-anchor="start">fracción acumulada</text>
  <text x="100" y="404" fill="#8b949e" font-size="11" font-weight="400" text-anchor="end">0</text>
  <text x="100" y="259.0" fill="#8b949e" font-size="11" font-weight="400" text-anchor="end">0,5</text>
  <text x="100" y="186.5" fill="#8b949e" font-size="11" font-weight="400" text-anchor="end">0,75</text>
  <text x="100" y="114" fill="#8b949e" font-size="11" font-weight="400" text-anchor="end">1</text>
  <text x="236.66666666666669" y="420" fill="#79c0ff" font-size="11" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace">le=&quot;0.05&quot;</text>
  <text x="363.33333333333337" y="420" fill="#79c0ff" font-size="11" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace">le=&quot;0.1&quot;</text>
  <text x="743.3333333333334" y="420" fill="#79c0ff" font-size="11" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace">le=&quot;0.25&quot;</text>
  <rect x="363.33333333333337" y="110" width="380.0" height="290" fill="#79c0ff" fill-opacity="0.07"/>
  <text x="553.3333333333334" y="342.0" fill="#79c0ff" font-size="12" font-weight="400" text-anchor="middle">bucket 0,1–0,25 s: un 25 % de los cobros</text>
  <polyline points="110.0,400 211.33333333333331,400 414.0,110 870.0,110" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <polyline points="110.0,400 236.66666666666669,363.75 300.0,273.125 363.33333333333337,182.5 743.3333333333334,110 870.0,110" fill="none" stroke="#79c0ff" stroke-width="2.5" stroke-dasharray="7 5"/>
  <circle cx="236.66666666666669" cy="363.75" r="4.5" fill="#79c0ff"/>
  <circle cx="300.0" cy="273.125" r="4.5" fill="#79c0ff"/>
  <circle cx="363.33333333333337" cy="182.5" r="4.5" fill="#79c0ff"/>
  <circle cx="743.3333333333334" cy="110" r="4.5" fill="#79c0ff"/>
  <line x1="110" y1="124.5" x2="667.3333333333334" y2="124.5" stroke="#F5A800" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="116" y="118.5" fill="#F5A800" font-size="11" font-weight="400" text-anchor="start">0,95</text>
  <line x1="403.8666666666667" y1="124.5" x2="403.8666666666667" y2="400" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="667.3333333333334" y1="124.5" x2="667.3333333333334" y2="400" stroke="#F5A800" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="403.8666666666667" cy="124.5" r="6" fill="none" stroke="#3fb950" stroke-width="2"/>
  <circle cx="667.3333333333334" cy="124.5" r="6" fill="none" stroke="#F5A800" stroke-width="2"/>
  <text x="411.8666666666667" y="255.0" fill="#3fb950" font-size="12" font-weight="600" text-anchor="start">p95 real</text>
  <text x="411.8666666666667" y="271.0" fill="#3fb950" font-size="12" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'Courier New', monospace">0,116 s</text>
  <text x="675.3333333333334" y="255.0" fill="#F5A800" font-size="12" font-weight="600" text-anchor="start">p95 estimado</text>
  <text x="675.3333333333334" y="271.0" fill="#F5A800" font-size="12" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'Courier New', monospace">0,1 + 0,8 × 0,15 = 0,22 s</text>
  <rect x="30" y="448" width="900" height="56" rx="7" fill="#161b22" stroke="#30363d"/>
  <polyline points="50,468 90,468" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <text x="100" y="472" fill="#8b949e" font-size="12" font-weight="400" text-anchor="start">real: pagos tarda entre 0,04 y 0,12 s, uniforme</text>
  <polyline points="50,490 90,490" fill="none" stroke="#79c0ff" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="100" y="494" fill="#8b949e" font-size="12" font-weight="400" text-anchor="start">lo que ve Prometheus: solo los límites de los buckets, unidos en línea recta</text>
  <text x="910" y="482" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="end">más buckets donde importa = menos error</text>
</svg>
