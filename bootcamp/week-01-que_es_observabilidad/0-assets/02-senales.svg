<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Las cuatro señales de una petición</title>
  <desc id="d">Una petición POST /orders deja rastro en cuatro señales. La métrica, de coste bajo, detecta si algo va mal. La traza localiza dónde se fue el tiempo. El log explica qué pasó con ese pedido. El perfil señala la función que gasta la CPU. Una investigación suele recorrerlas en ese orden.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#79c0ff"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d2a8ff"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F5A800"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/>
  <rect width="5" height="540" fill="#F5A800"/>
  <text x="30" y="38" fill="#e6edf3" font-size="20" font-weight="600" text-anchor="start">Las cuatro señales de una petición</text>
  <rect x="30" y="262" width="170" height="70" rx="7" fill="#161b22" stroke="#F5A800" stroke-width="2"/>
  <text x="115.0" y="295.0" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">POST /orders</text>
  <text x="115.0" y="312.0" fill="#8b949e" font-size="11" font-weight="400" text-anchor="middle">una petición</text>
  <polyline points="200,297 230,297 230,124 258,124" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a-muted)"/>
  <rect x="260" y="80" width="670" height="88" rx="7" fill="#161b22" stroke="#30363d"/>
  <rect x="260" y="80" width="5" height="88" fill="#79c0ff"/>
  <text x="285" y="116" fill="#79c0ff" font-size="18" font-weight="600" text-anchor="start">Métrica</text>
  <text x="285" y="138" fill="#8b949e" font-size="11" font-weight="400" text-anchor="start">coste bajo</text>
  <text x="285" y="154" fill="#8b949e" font-size="11" font-weight="400" text-anchor="start">pedidos/s · p95 del checkout</text>
  <polyline points="470,140 495,136 520,138 545,130 570,133 595,112 620,108 645,126 670,130" fill="none" stroke="#79c0ff" stroke-width="2"/>
  <text x="720" y="120" fill="#e6edf3" font-size="14" font-weight="400" text-anchor="start">¿Algo va mal?</text>
  <rect x="720" y="132" width="100" height="22" rx="11" fill="none" stroke="#79c0ff"/>
  <text x="770" y="147" fill="#79c0ff" font-size="12" font-weight="600" text-anchor="middle">Detectar</text>
  <polyline points="200,297 230,297 230,236 258,236" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a-muted)"/>
  <rect x="260" y="192" width="670" height="88" rx="7" fill="#161b22" stroke="#30363d"/>
  <rect x="260" y="192" width="5" height="88" fill="#F5A800"/>
  <text x="285" y="228" fill="#F5A800" font-size="18" font-weight="600" text-anchor="start">Traza</text>
  <text x="285" y="250" fill="#8b949e" font-size="11" font-weight="400" text-anchor="start">coste medio, se muestrea</text>
  <text x="285" y="266" fill="#8b949e" font-size="11" font-weight="400" text-anchor="start">un span por salto</text>
  <rect x="470" y="212" width="200" height="9" rx="2" fill="#F5A800" opacity="1.00"/>
  <rect x="480" y="224" width="40" height="9" rx="2" fill="#F5A800" opacity="0.82"/>
  <rect x="530" y="236" width="110" height="9" rx="2" fill="#F5A800" opacity="0.64"/>
  <rect x="645" y="248" width="20" height="9" rx="2" fill="#F5A800" opacity="0.46"/>
  <text x="720" y="232" fill="#e6edf3" font-size="14" font-weight="400" text-anchor="start">¿Dónde se fue el tiempo?</text>
  <rect x="720" y="244" width="100" height="22" rx="11" fill="none" stroke="#F5A800"/>
  <text x="770" y="259" fill="#F5A800" font-size="12" font-weight="600" text-anchor="middle">Localizar</text>
  <polyline points="200,297 230,297 230,348 258,348" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a-muted)"/>
  <rect x="260" y="304" width="670" height="88" rx="7" fill="#161b22" stroke="#30363d"/>
  <rect x="260" y="304" width="5" height="88" fill="#3fb950"/>
  <text x="285" y="340" fill="#3fb950" font-size="18" font-weight="600" text-anchor="start">Log</text>
  <text x="285" y="362" fill="#8b949e" font-size="11" font-weight="400" text-anchor="start">coste alto, crece con el tráfico</text>
  <text x="285" y="378" fill="#8b949e" font-size="11" font-weight="400" text-anchor="start">una línea con contexto</text>
  <rect x="464" y="330" width="232" height="36" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="474" y="346" fill="#3fb950" font-size="11" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'Courier New', monospace">ERROR Error llamando a</text>
  <text x="474" y="360" fill="#3fb950" font-size="11" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'Courier New', monospace">pagos: ReadTimeout(&#x27;&#x27;)</text>
  <text x="720" y="344" fill="#e6edf3" font-size="14" font-weight="400" text-anchor="start">¿Por qué falló este pedido?</text>
  <rect x="720" y="356" width="100" height="22" rx="11" fill="none" stroke="#3fb950"/>
  <text x="770" y="371" fill="#3fb950" font-size="12" font-weight="600" text-anchor="middle">Explicar</text>
  <polyline points="200,297 230,297 230,460 258,460" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a-muted)"/>
  <rect x="260" y="416" width="670" height="88" rx="7" fill="#161b22" stroke="#30363d"/>
  <rect x="260" y="416" width="5" height="88" fill="#d2a8ff"/>
  <text x="285" y="452" fill="#d2a8ff" font-size="18" font-weight="600" text-anchor="start">Perfil</text>
  <text x="285" y="474" fill="#8b949e" font-size="11" font-weight="400" text-anchor="start">coste medio</text>
  <text x="285" y="490" fill="#8b949e" font-size="11" font-weight="400" text-anchor="start">muestras de CPU</text>
  <rect x="470" y="472" width="200" height="10" fill="#d2a8ff" opacity="0.45"/>
  <rect x="470" y="460" width="150" height="10" fill="#d2a8ff" opacity="0.63"/>
  <rect x="490" y="448" width="110" height="10" fill="#d2a8ff" opacity="0.81"/>
  <rect x="500" y="436" width="60" height="10" fill="#d2a8ff" opacity="0.99"/>
  <text x="720" y="456" fill="#e6edf3" font-size="14" font-weight="400" text-anchor="start">¿Qué función es la cara?</text>
  <rect x="720" y="468" width="100" height="22" rx="11" fill="none" stroke="#d2a8ff"/>
  <text x="770" y="483" fill="#d2a8ff" font-size="12" font-weight="600" text-anchor="middle">Optimizar</text>
  <text x="30" y="62" fill="#8b949e" font-size="13" font-weight="400" text-anchor="start">Una misma petición deja rastro en las cuatro señales; cada una responde una pregunta distinta.</text>
</svg>
