<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Arquitectura de la tienda</title>
  <desc id="d">trafico (k6) llama a catalogo y a pedidos. pedidos pide a catalogo precio y reserva por HTTP, cobra en pagos a través de toxiproxy con un timeout de 2 segundos, guarda en PostgreSQL y publica order.created en RabbitMQ, de donde consume notificaciones sin que pedidos espere. catalogo lee PostgreSQL a través de toxiproxy y usa Valkey como caché.</desc>
