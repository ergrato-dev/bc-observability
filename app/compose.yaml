# Laboratorio del bootcamp. Úsalo con ./scripts/lab-up.sh <perfil>.
#
# Sin perfil: la tienda (perfil core). Cada semana añade los servicios de su
# señal bajo su perfil (metrics, logs, traces, profiles, scale, ai): ver
# docs/perfiles-de-laboratorio.md.
#
# El código de los servicios se construye desde app/ o, si se define
# TIENDA_SRC (ruta absoluta), desde esa carpeta: así cada semana trabaja sobre
# su propia copia de la tienda. Úsalo a través de lab-up.sh con TIENDA=<carpeta>.
#
# Prometheus descubre sus targets en Docker: scrapea los contenedores con la
# etiqueta prometheus.io/scrape=true, en el puerto de prometheus.io/port.
#
# Todos los puertos se publican solo en 127.0.0.1. Las contraseñas de este
# archivo son del laboratorio: no salen de tu máquina.

name: tienda

x-python-service: &python-service
  restart: unless-stopped
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s

services:
  # ── Tienda ──────────────────────────────────────────────────────────────
  catalogo:
    <<: *python-service
    build:
      context: ${TIENDA_SRC:-.}/catalogo
      dockerfile: ../Dockerfile.python
    image: tienda/catalogo:1.0.0
    environment:
      # Pasa por toxiproxy para poder inyectar latencia en la base de datos.
      DATABASE_URL: postgresql://tienda:tienda@toxiproxy:5433/tienda
      VALKEY_URL: redis://valkey:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:18001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      toxiproxy:
        condition: service_started

  pedidos:
    <<: *python-service
    build:
      context: ${TIENDA_SRC:-.}/pedidos
      dockerfile: ../Dockerfile.python
    image: tienda/pedidos:1.0.0
    environment:
      DATABASE_URL: postgresql://tienda:tienda@postgres:5432/tienda
      RABBITMQ_URL: amqp://tienda:tienda@rabbitmq:5672/
      CATALOGO_URL: http://catalogo:8000
      # Pasa por toxiproxy para poder inyectar latencia o cortes de red.
      PAGOS_URL: http://toxiproxy:8666
      PAGOS_TIMEOUT_SECONDS: "2"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:18002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalogo:
        condition: service_healthy
      pagos:
        condition: service_healthy

  pagos:
    <<: *python-service
    build:
      context: ${TIENDA_SRC:-.}/pagos
      dockerfile: ../Dockerfile.python
    image: tienda/pagos:1.0.0
    environment:
      PAGOS_ERROR_RATE: "0.02"
      PAGOS_LATENCY_MS: "80"
      PAGOS_JITTER_MS: "40"
      PAGOS_TIMEOUT_RATE: "0"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:18003:8000"

  notificaciones:
    build: ${TIENDA_SRC:-.}/notificaciones
    image: tienda/notificaciones:1.0.0
    restart: unless-stopped
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3000"
    environment:
      RABBITMQ_URL: amqp://tienda:tienda@rabbitmq:5672/
      NOTIFICACIONES_DELAY_MS: "50"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:18004:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ── Dependencias ────────────────────────────────────────────────────────
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tienda
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: tienda
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tienda", "-d", "tienda"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.3-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: tienda
      RABBITMQ_DEFAULT_PASS: tienda
    ports:
      - "127.0.0.1:15672:15672"   # consola de gestión
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Averías y tráfico ───────────────────────────────────────────────────
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    restart: unless-stopped
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"     # API de toxiproxy

  trafico:
    image: grafana/k6:1.8.2
    restart: unless-stopped
    command: ["run", "--quiet", "--summary-mode=disabled", "/scripts/compra.js"]
    environment:
      RATE: "2"
      DURATION: "24h"
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      catalogo:
        condition: service_healthy
      pedidos:
        condition: service_healthy

  # ── Métricas (perfil metrics) ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [metrics]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle   # POST /-/reload relee la configuración
    # La configuración es parte de tu entrega: vive en tu copia de la tienda.
    volumes:
      - ${TIENDA_SRC:-.}/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
      # Solo lectura para el service discovery de Docker. Quien lee este socket
      # controla Docker: aceptable en tu laboratorio, nunca en producción.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:-0}"   # grupo dueño del socket; lo calcula lab-up.sh
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9090"
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [metrics]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      # Sin los montajes de sistema y de Docker (en WSL2, /run/user sale duplicado).
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9100"
    ports:
      - "127.0.0.1:9100:9100"

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    profiles: [metrics]
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    privileged: true   # lee los cgroups y el disco del host
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
